<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rio Localizador</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="auth-screen">
    <div class="auth-box">
      <h1>Rio Localizador</h1>
      <p>Compartilhe sua localização em tempo real</p>
      
      <form id="login-form">
        <input type="email" id="email" placeholder="E-mail" required />
        <input type="password" id="password" placeholder="Senha" required />
        <button type="submit" class="btn-primary">Entrar</button>
      </form>

      <button type="button" id="btn-register" class="btn-secondary">Cadastrar</button>
      <button type="button" id="btn-forgot-password" class="btn-link">Esqueceu a senha?</button>
      
      <div class="divider">ou</div>
      
      <button type="button" id="btn-google-login" class="btn-google">Entrar com Google</button>
    </div>
  </div>

  <div id="map-screen" class="hidden">
    <header class="app-header">
      <button id="btn-open-drawer" class="btn-icon" title="Abrir Menu">☰</button>
      <h2>Rio Localizador</h2>
      <button id="btn-logout" class="btn-header-logout">Sair</button>
    </header>

    <div id="map">
      <button id="btn-recenter" class="btn-recenter" title="Minha Posição">🎯</button>
    </div>
  </div>

  <div id="drawer-overlay" class="drawer-overlay hidden"></div>
  <aside id="drawer" class="drawer">
    <div class="drawer-header">
      <h3>Menu Principal</h3>
      <button id="btn-close-drawer" class="btn-icon">✕</button>
    </div>
    <div class="drawer-content">
      <div class="drawer-section">
        <button id="btn-toggle-history" class="btn-drawer-action">Meu Trajeto (30 dias)</button>
        <button id="btn-update-phone" class="btn-drawer-action">Cadastrar/Alterar Telefone</button>
        <button id="btn-share-invite" class="btn-drawer-action btn-whatsapp">Gerar Convite de Amizade</button>
      </div>

      <div class="drawer-section">
        <h4>Adicionar Amigo</h4>
        <form id="add-friend-form">
          <select id="friend-search-type">
            <option value="email">Buscar por E-mail</option>
            <option value="phone">Buscar por Telefone</option>
          </select>
          <input type="email" id="friend-email-input" placeholder="E-mail do amigo" required />
          <input type="tel" id="friend-phone-input" placeholder="Telefone (ex: 21999998888)" class="hidden" />
          <button type="submit" class="btn-primary">Enviar Pedido</button>
        </form>
      </div>

      <div class="drawer-section">
        <h4>Solicitações Pendentes</h4>
        <div id="pending-requests-list"></div>
      </div>

      <div class="drawer-section">
        <h4>Meus Amigos</h4>
        <div id="friends-list"></div>
      </div>
    </div>
  </aside>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="
