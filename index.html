<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoFriends</title>
  
  <!-- CSS do Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Tela 1: Login/Cadastro -->
  <div id="auth-screen" class="screen">
    <div class="auth-card">
      <h2>GeoFriends</h2>
      <p>Acompanhe a localização dos seus amigos</p>
      
      <form id="auth-form">
        <input type="email" id="email" placeholder="E-mail" required autocomplete="username">
        <input type="password" id="password" placeholder="Senha" required autocomplete="current-password">
        
        <button type="submit" id="btn-login">Entrar</button>
        <button type="button" id="btn-signup" class="btn-secondary">Criar Conta</button>
      </form>
      <p id="auth-error" class="error-msg"></p>
    </div>
  </div>

  <!-- Tela 2: Aplicação Principal (Mapa) -->
  <div id="map-screen" class="screen hidden">
    <!-- Barra Superior -->
    <header class="app-header">
      <div class="header-left">
        <button id="btn-toggle-menu" class="btn-menu-toggle" title="Abrir/Fechar Menu">☰</button>
        <span id="user-display-email" class="user-email-text"></span>
      </div>
      <button id="btn-logout" class="btn-logout">Sair</button>
    </header>

    <!-- Área Principal (Mapa + Overlay) -->
    <div class="main-container">
      <!-- Painel Lateral de Amigos -->
      <aside id="friends-panel" class="friends-panel">
        <div class="panel-header">
          <h3>Amigos</h3>
          <button id="btn-close-panel" class="btn-close">✕</button>
        </div>
        
        <!-- Adicionar Amigo -->
        <div class="add-friend-box">
          <input type="email" id="friend-email-input" placeholder="E-mail do amigo">
          <button id="btn-add-friend">+</button>
        </div>
        
        <!-- Lista de Solicitações Pendentes -->
        <div class="section-title">Solicitações</div>
        <ul id="requests-list" class="friends-list"></ul>

        <!-- Lista de Amigos Aceitos -->
        <div class="section-title">Seus Amigos</div>
        <ul id="friends-list" class="friends-list"></ul>
      </aside>

      <!-- Container do Mapa -->
      <div id="map"></div>
    </div>

    <!-- Controles Flutuantes do Mapa -->
    <div class="map-controls">
      <button id="btn-recenter" title="Centralizar em mim">🎯</button>
      <button id="btn-my-history" title="Meu Histórico do Dia">📜</button>
    </div>
  </div>

  <!-- SDKs do Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <!-- JS do Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Script da Aplicação -->
  <script src="app.js"></script>
</body>
</html>
