<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rio Localizador</title>
  
  <!-- CSS do Leaflet (Mapa) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Seu CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="auth-screen">
    <div class="auth-box">
      <h1>Rio Localizador</h1>
      <p>Compartilhe sua localização em tempo real</p>
      
      <form id="login-form">
        <input type="email" id="email" placeholder="E-mail" required />
        <input type="password" id="password" placeholder="Senha" required />
        <button type="submit">Entrar</button>
      </form>
      
      <button type="button" id="btn-register" class="btn-secondary">Cadastrar</button>
      <button type="button" id="btn-forgot-password" class="btn-link">Esqueceu a senha?</button>
      
      <div class="divider">ou</div>
      
      <button type="button" id="btn-google-login" class="btn-google">Entrar com Google</button>
    </div>
  </div>

  <!-- TELA DO MAPA -->
  <div id="map-screen" class="hidden">
    <!-- Cabeçalho -->
    <header class="app-header">
      <button id="btn-open-drawer" class="btn-icon">☰</button>
      <h2>Rio Localizador</h2>
      <button id="btn-logout" class="btn-small">Sair</button>
    </header>

    <!-- Container do Mapa -->
    <div id="map"></div>

    <!-- Botão Flutuante de Centralizar (Aparece no canto inferior direito) -->
    <button id="btn-recenter" class="btn-floating" title="Minha Posição">🎯</button>
  </div>

  <!-- MENU LATERAL (DRAWER) -->
  <div id="drawer-overlay" class="drawer-overlay hidden"></div>
  <aside id="drawer" class="drawer">
    <div class="drawer-header">
      <h3>Menu</h3>
      <button id="btn-close-drawer" class="btn-icon">✕</button>
    </div>
    <div class="drawer-content">
      <div class="drawer-section">
        <button id="btn-toggle-history" class="btn-secondary" style="width: 100%;">Meu Trajeto (30 dias)</button>
        <button id="btn-update-phone" class="btn-secondary" style="width: 100%; margin-top: 8px;">Cadastrar/Alterar Telefone</button>
        <button id="btn-share-invite" class="btn-secondary" style="width: 100%; margin-top: 8px; background-color: #25D366; color: white;">Gerar Convite de Amizade</button>
      </div>

      <div class="drawer-section">
        <h4>Adicionar Amigo</h4>
        <form id="add-friend-form">
          <select id="friend-search-type">
            <option value="email">Buscar por E-mail</option>
            <option value="phone">Buscar por Telefone</option>
          </select>
          <input type="email" id="friend-email-input" placeholder="E-mail do amigo" required />
          <input type="tel" id="friend-phone-input" placeholder="Telefone (ex: 21999998888)" class="hidden" />
          <button type="submit" style="width: 100%; background-color: #0052d4; color: white; border: none; margin-top: 4px;">Enviar Pedido</button>
        </form>
      </div>

      <div class="drawer-section">
        <h4>Solicitações Pendentes</h4>
        <div id="pending-requests-list"></div>
      </div>

      <div class="drawer-section">
        <h4>Meus Amigos</h4>
        <div id="friends-list"></div>
      </div>
    </div>
  </aside>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Seu Script JS -->
  <script src="app.js"></script>
</body>
</html>
